<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marquesina — buscador para Videasy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>

<div class="perf-strip" id="perf"></div>

<header>
  <div class="eyebrow">Uso personal · local</div>
  <h1>Busca. Elige. <em>Reproduce.</em></h1>
  <p class="sub">Escribe un título, elige el resultado correcto y se carga directo en el reproductor de Videasy — sin buscar IDs a mano.</p>
</header>

<main>
  <div class="searchbar">
    <input type="text" id="q" placeholder="Ej: Breaking Bad, Dune, Avengers Endgame…" autocomplete="off">
    <button id="go">Buscar</button>
  </div>
  <div class="apikey-row">
    <span>TMDB API key:</span>
    <input type="text" id="apikey" placeholder="pega tu API key aquí" value="653bb8af90162bd98fc7ee32bcbbfb3d">
    <a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener">conseguir la mía gratis →</a>
  </div>

  <div id="results" class="grid"></div>
  <div id="status" class="status" style="display:none;"></div>
</main>

<footer>
  Metadatos vía <a href="https://www.themoviedb.org" target="_blank" rel="noopener">TMDB</a> · Reproductor vía <a href="https://videasy.net" target="_blank" rel="noopener">Videasy</a>
</footer>

<div class="player-overlay" id="overlay">
  <div class="player-box">
    <div class="player-topbar">
      <div class="now" id="nowPlaying">—</div>
      <button class="close-btn" id="closeBtn">✕</button>
    </div>
    <iframe id="player" src="" allowfullscreen allow="encrypted-media"></iframe>
  </div>
</div>

<script type="module" src="./js/app.js"></script>

</body>
</html>
